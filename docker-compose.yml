# Parlour + Postgres for local development.
# Usage: cp .env.example .env, adjust, then `docker compose up --build`.
# Media is mounted read-only; point PARLOUR_MEDIA_PATH at your library.

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-parlour}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-parlour}
    volumes:
      - parlour-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parlour}"]
      interval: 5s
      timeout: 3s
      retries: 10

  parlour:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PARLOUR_DATABASE_URL: ${PARLOUR_DATABASE_URL:-postgres://parlour:change-me@db:5432/parlour?sslmode=disable}
      PARLOUR_PORT: ${PARLOUR_PORT:-8585}
      PARLOUR_LOG_LEVEL: ${PARLOUR_LOG_LEVEL:-info}
      PARLOUR_ADMIN_USER: ${PARLOUR_ADMIN_USER:-}
      PARLOUR_ADMIN_PASSWORD: ${PARLOUR_ADMIN_PASSWORD:-}
      PARLOUR_COOKIE_SECURE: ${PARLOUR_COOKIE_SECURE:-false}
      # Metadata (Milestone 1.4): TMDB key comes from .env as
      # TMDB_API_KEY (the name already in use on the servers).
      PARLOUR_TMDB_API_KEY: ${TMDB_API_KEY:-${PARLOUR_TMDB_API_KEY:-}}
      PARLOUR_TVDB_API_KEY: ${PARLOUR_TVDB_API_KEY:-}
      PARLOUR_ARTWORK_DIR: /artwork
      PARLOUR_CACHE_DIR: /cache
      PARLOUR_EMBY_URL: ${PARLOUR_EMBY_URL:-}
      PARLOUR_EMBY_API_KEY: ${PARLOUR_EMBY_API_KEY:-}
    ports:
      - "${PARLOUR_PORT:-8585}:${PARLOUR_PORT:-8585}"
    volumes:
      - ${PARLOUR_MEDIA_PATH:-./media}:/media:ro
      - parlour-artwork:/artwork
      - parlour-cache:/cache
    # GPU transcoding (Phase 2) — enable ONE block for your host:
    # NVIDIA: also add the nvidia runtime / device reservation.
    # devices:
    #   - /dev/dri:/dev/dri   # Intel Quick Sync / AMD VAAPI

volumes:
  parlour-db:
  parlour-artwork:
  parlour-cache:
