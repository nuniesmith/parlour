[package]
name = "parlour-server"
version = "0.1.0"
description = "Parlour server binary: config, startup, backend probing, HTTP routers."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "parlour"
path = "src/main.rs"

[dependencies]
parlour-core = { path = "../core" }
parlour-db = { path = "../db" }
parlour-catalog = { path = "../catalog" }
parlour-jobs = { path = "../jobs" }
parlour-metadata = { path = "../metadata" }
parlour-playback = { path = "../playback" }
reqwest.workspace = true
notify.workspace = true
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
uuid.workspace = true
rust-embed.workspace = true
mime_guess.workspace = true
dotenvy.workspace = true
sqlx.workspace = true
argon2.workspace = true
sha2.workspace = true
hmac.workspace = true
base64.workspace = true
tokio-util.workspace = true
rand.workspace = true
chrono.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
